
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <h2>ShopEasy</h2>

        <div class="nav-actions">
            <a href="#home">Home</a>
            <a href="#products">Products</a>

            <button class="cart-nav-button" onclick="showCart()">
                Cart (<span id="cart-count">0</span>)
            </button>
        </div>
    </header>

    <!-- HOME -->
    <section class="hero" id="home">
        <div>
            <h1>Welcome to ShopEasy</h1>
            <p>Everything you need, all in one place.</p>
            <a href="#products" class="shop-button">Shop Now</a>
        </div>
    </section>

    <!-- PRODUCTS -->
    <main class="container" id="products">

        <h1>Our Products</h1>

        <!-- SEARCH -->
        <div class="search-container">
            <input
                type="text"
                id="search"
                placeholder="Search products..."
            >
        </div>

        <!-- CATEGORIES -->
        <div class="categories">
            <button class="category-btn active" data-category="all">
                All
            </button>

            <button class="category-btn" data-category="electronics">
                Electronics
            </button>

            <button class="category-btn" data-category="accessories">
                Accessories
            </button>

            <button class="category-btn" data-category="home">
                Home Appliances
            </button>
        </div>

        <!-- PRODUCT LIST -->
        <div id="product-list" class="product-grid">
            <p>Loading products...</p>
        </div>

        <p id="no-products" hidden>No products found.</p>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 ShopEasy. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
