
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEasy - Online Shopping</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <h2>ShopEasy</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="#products">Products</a>
            <a href="cart.html">
                Cart (<span id="cart-count">0</span>)
            </a>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>Welcome to ShopEasy</h1>
        <p>Everything you need, all in one place!</p>
    </section>

    <!-- PRODUCTS SECTION -->
    <main class="container" id="products">

        <h2>Our Products</h2>

        <!-- SEARCH -->
        <input
            type="text"
            id="search"
            placeholder="Search products..."
            oninput="searchProducts()"
        >

        <!-- PRODUCT CATEGORIES -->
        <div class="categories">

            <button onclick="filterProducts('all')">
                All
            </button>

            <button onclick="filterProducts('electronics')">
                Electronics
            </button>

            <button onclick="filterProducts('accessories')">
                Accessories
            </button>

            <button onclick="filterProducts('home')">
                Home Appliances
            </button>

            <button onclick="filterProducts('food')">
                Food & Groceries
            </button>

            <button onclick="filterProducts('dresses')">
                Dresses
            </button>

        </div>

        <!-- PRODUCTS DISPLAY -->
        <div id="product-list" class="product-grid"></div>

        <p id="no-products" style="display:none;">
            No products found.
        </p>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 ShopEasy. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
